events {
    worker_connections 1024;
}

http {
    # --- UPSTREAM: chat-ws Microservice (WebSocket servers) ---
    upstream chat_ws_servers {
        least_conn;
        server 127.0.0.1:5002;
        server 127.0.0.1:5003;
    }

    # --- UPSTREAM: core-api Microservice (REST API servers) ---
    upstream core_api_servers {
        server 127.0.0.1:5001;
    }

    server {
        listen 8080;
        server_name localhost;

        # --- WebSocket Connections ---
        # Route socket.io traffic to the chat-ws service
        location /socket.io/ {
            proxy_pass http://chat_ws_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        # --- HTTP API Requests ---
        # Route all other traffic to the core-api service
        location / {
            proxy_pass http://core_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
