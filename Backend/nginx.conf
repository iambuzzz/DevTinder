# [PHASE 3: MULTI-SERVER TEST - NGINX LOAD BALANCER CONFIG]
#
# WHAT: This NGINX config acts as a Load Balancer in front of 2 backend servers.
#        
# WHY: To prove that gRPC inter-server communication works correctly.
#      User A connects to Server 1, User B connects to Server 2.
#      When A sends a message, Server 1 uses gRPC to tell Server 2 
#      to deliver it to B's WebSocket. 
#
# HOW: 
#   NGINX listens on port 8080 and distributes traffic:
#     - HTTP API requests → Round-robin between Server 1 (3000) and Server 2 (3001)
#     - WebSocket connections → Least connections (as you wanted, not sticky sessions!)
#
# SETUP:
#   1. Start Redis:       redis-server
#   2. Start Server 1:    HTTP_PORT=3000 GRPC_PORT=4000 node src/app.js
#   3. Start Server 2:    HTTP_PORT=3001 GRPC_PORT=4001 node src/app.js
#   4. Start NGINX:       nginx -c $(pwd)/nginx.conf
#   5. Update Frontend:   Change BASE_URL and SOCKET_URL to http://localhost:8080/
#   6. Start Frontend:    npm run dev

events {
    worker_connections 1024;
}

http {
    # --- UPSTREAM: Our 2 backend servers ---
    # "least_conn" means NGINX sends new connections to the server 
    # with the fewest active connections (exactly what you asked for!)
    upstream backend_servers {
        least_conn;
        server 127.0.0.1:3000;    # Server 1 (HTTP)
        server 127.0.0.1:3001;    # Server 2 (HTTP)
        server 127.0.0.1:3002;    # Server 3 (HTTP)
    }

    server {
        listen 8080;
        server_name localhost;

        # --- HTTP API Requests ---
        # All normal API calls (login, feed, chat, etc.) are load-balanced
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookie forwarding (for auth tokens)
            proxy_set_header Cookie $http_cookie;
        }

        # --- WebSocket Connections ---
        # Socket.io first makes an HTTP polling request, then upgrades to WebSocket.
        # We need to pass the Upgrade headers so the connection can be established.
        location /socket.io/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # These 2 headers are the MAGIC that allows WebSocket upgrade!
            # Without them, the connection stays as HTTP polling and never 
            # upgrades to a real WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;

            # Longer timeouts for WebSocket (default 60s would kill idle connections)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
