# Backend/nginx.conf jaisa hi hai, bas Docker container ke andar chalta hai.
# Container ke andar 127.0.0.1 khud container hota hai, isliye host machine ke
# Node servers ke liye host.docker.internal use kiya hai.

events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        least_conn;
        server host.docker.internal:3000;
        server host.docker.internal:3001;
        server host.docker.internal:3002;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location /socket.io/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
